name: Orchestrate autofix until success

on:
  workflow_run:
    workflows: ["Export and Deploy Godot (HTML5)"]
    types: [completed]

jobs:
  orchestrate:
    name: Orchestrate autofix attempts
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Orchestrate retries and report
        uses: actions/github-script@v6
        with:
          script: |
            const run = github.event.workflow_run
            const owner = context.repo.owner
            const repo = context.repo.repo
            const workflow_id = run.workflow_id
            const originalRunId = run.id
            const originalCreated = new Date(run.created_at).getTime()

            const maxAttempts = 10
            const delayMs = 30000 // 30s between polls

            function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

            core.info(`Orchestration started for run ${originalRunId} (workflow ${workflow_id})`)

            // helper: find any successful run that started after original
            async function findSuccessfulRun(){
              const resp = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, per_page: 20 })
              const runs = resp.data.workflow_runs || []
              for (const r of runs) {
                const t = new Date(r.created_at).getTime()
                if (t <= originalCreated) continue
                if (r.conclusion === 'success') return r
              }
              return null
            }

            // helper: find latest run after original
            async function findLatestRun(){
              const resp = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, per_page: 20 })
              const runs = resp.data.workflow_runs || []
              let latest = null
              for (const r of runs) {
                const t = new Date(r.created_at).getTime()
                if (t <= originalCreated) continue
                if (!latest || new Date(r.created_at).getTime() > new Date(latest.created_at).getTime()) latest = r
              }
              return latest
            }

            // helper: check for autofix PR merged after original run
            async function findMergedAutofixPR(){
              const prs = await github.rest.pulls.list({ owner, repo, state: 'closed', per_page: 50 })
              for (const p of prs.data) {
                if (!p.head || !p.head.ref) continue
                if (!p.head.ref.startsWith('autofix/')) continue
                if (!p.merged_at) continue
                const mergedTs = new Date(p.merged_at).getTime()
                if (mergedTs > originalCreated) return p
              }
              return null
            }

            // notify helper: create or update an issue for reporting, use report-failed-workflows created issue as channel
            async function postStatus(message){
              // create a short issue to notify owner
              const title = `Autofix report for workflow run ${originalRunId}`
              await github.rest.issues.create({ owner, repo, title, body: message }).catch(e=>core.info('issue create failed: '+e.message))
            }

            let attempt = 0
            let successRun = null
            while (attempt < maxAttempts) {
              attempt++
              core.info(`Orchestration attempt ${attempt}/${maxAttempts}`)

              // check if a successful run appeared
              successRun = await findSuccessfulRun()
              if (successRun) {
                core.info(`Found successful run ${successRun.id} created_at=${successRun.created_at}`)
                await postStatus(`Workflow resolved: successful run ${successRun.html_url} detected after autofix attempts.`)
                return
              }

              // check latest run status and record
              const latest = await findLatestRun()
              if (latest) {
                core.info(`Latest run after original: id=${latest.id} conclusion=${latest.conclusion} url=${latest.html_url}`)
                // if latest concluded failure, allow time for autofix workflows to run (they trigger on failure)
                if (latest.conclusion === 'failure') {
                  // If there is a merged autofix PR after original, we should wait for run triggered by merge
                  const mergedPR = await findMergedAutofixPR()
                  if (mergedPR) {
                    core.info(`Found merged autofix PR #${mergedPR.number} merged_at=${mergedPR.merged_at}`)
                    // wait for subsequent run to appear in next attempts
                  } else {
                    core.info('No merged autofix PR found yet; waiting for auto-fix to create PR/merge')
                  }
                }
              } else {
                core.info('No later runs found yet; waiting')
              }

              // small sleep before next poll
              await sleep(delayMs)
            }

            // if we reach here, attempts exhausted
            core.info('Orchestration exhausted attempts without resolution')
            await postStatus(`Autofix orchestrator attempted ${maxAttempts} cycles but workflow is still failing. Manual review required. Original run: ${run.html_url}`)
