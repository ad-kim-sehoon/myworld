name: Auto-fix simple CI failures

on:
  workflow_run:
    workflows: ["Export and Deploy Godot (HTML5)"]
    types: [completed]

jobs:
  autofix:
    name: Attempt safe fixes and open PR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "OpenClaw AutoFix"
          git config user.email "autofix@openclaw.local"

      - name: Scan for common problematic patterns
        id: scan
        run: |
          set -euo pipefail
          REPO_ROOT="${GITHUB_WORKSPACE}"
          echo "Scanning workflows for problematic patterns..."
          # detect heredoc (<<'EOF' or <<EOF) in workflow files
          HEREDOC_COUNT=$(grep -R --line-number "<<'EOF'\|<<EOF" .github/workflows || true | wc -l)
          # detect unquoted step names that contain colon
          UNQUOTED_COLON_COUNT=$(grep -R --line-number "^- name:\s*[^\"']*:\"" .github/workflows || true | wc -l || true)
          # detect deprecated upload-artifact usage
          UPLOAD_ARTIFACT_COUNT=$(grep -R --line-number "actions/upload-artifact@v3\|actions/upload-artifact@v2" .github/workflows || true | wc -l)

          echo "heredoc=$HEREDOC_COUNT" >> $GITHUB_OUTPUT
          echo "unquoted_colon=$UNQUOTED_COLON_COUNT" >> $GITHUB_OUTPUT
          echo "upload_artifact_refs=$UPLOAD_ARTIFACT_COUNT" >> $GITHUB_OUTPUT

      - name: Attempt safe automated edits
        if: ${{ steps.scan.outputs.heredoc != '0' || steps.scan.outputs.upload_artifact_refs != '0' || steps.scan.outputs.unquoted_colon != '0' }}
        run: |
          set -euo pipefail
          BRANCH="autofix/workflow-fix-$(date +%s)"
          git switch -c "$BRANCH"

          CHANGED=0

          # 1) Replace deprecated upload-artifact references with peaceiris deploy flow suggestion comment
          if grep -R --line-number "actions/upload-artifact@v2\|actions/upload-artifact@v3" .github/workflows >/dev/null 2>&1; then
            echo "Replacing deprecated upload-artifact usages with peaceiris/actions-gh-pages suggestion"
            # prefer to replace upload-pages-artifact/deploy-pages combination with peaceiris usage in our specific file
            sed -i.bak -E "s|uses:\s*actions/upload-pages-artifact@v[0-9]+|# REMOVED: upload-pages-artifact (replaced by actions-gh-pages)|g" .github/workflows/*.yml || true
            sed -i.bak -E "s|uses:\s*actions/deploy-pages@v[0-9]+|# REMOVED: deploy-pages (replaced by actions-gh-pages)|g" .github/workflows/*.yml || true
            CHANGED=1
          fi

          # 2) Quote unquoted names that contain a colon (e.g., - name: Debug: ...)
          # This is a conservative transform that only quotes the name portion on matching lines.
          if grep -R "^- name: .*:.*" .github/workflows >/dev/null 2>&1; then
            echo "Quoting step names that contain ':' to avoid YAML parsing issues"
            # Use perl to replace - name: SOMETEXT: with - name: "SOMETEXT:"
            perl -0777 -pe 's/^([ \t]*- name:\s*)([^"\'\n][^\n]*:.*)$/\1"$2"/mg' -i .github/workflows/*.yml || true
            CHANGED=1
          fi

          # 3) Remove simple heredoc creation blocks that write multi-line content into files (risky); instead leave a comment for manual fix
          # This will delete from the line containing <<'EOF' (or <<EOF) through the next line that starts with EOF
          if grep -R "<<'EOF'\|<<EOF" .github/workflows >/dev/null 2>&1; then
            echo "Removing heredoc blocks (converted to comments) to avoid YAML parsing issues"
            for f in $(grep -R --line-number "<<'EOF'\|<<EOF" .github/workflows | cut -d: -f1 | sort -u); do
              echo "Processing $f"
              # create a temporary file with heredoc blocks replaced by a placeholder comment
              awk 'BEGIN{in=0} { if (in==0 && $0 ~ /<<\'EOF\'|<<EOF/) { print "# HEREDOC_BLOCK_REPLACED"; in=1; next } if (in==1 && $0 ~ /^EOF$/) { in=0; next } if (in==0) print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
              CHANGED=1
            done
          fi

          # If changes made, commit and open PR
          if [ "$CHANGED" -ne 0 ]; then
            git add -A
            git commit -m "chore(ci): auto-fix workflow YAML (quote names, remove heredoc, replace deprecated artifact refs)" || true
            git push --set-upstream origin "$BRANCH"

            echo "Creating Pull Request via GitHub API"
            gh pr create --title "autofix: workflow YAML fixes" --body "This PR was opened automatically to fix common workflow YAML issues detected after a failed run. Please review before merging." --base main --head "$BRANCH" || true
          else
            echo "No automated changes applied"
          fi

      - name: Report no-ops if nothing to do
        if: ${{ steps.scan.outputs.heredoc == '0' && steps.scan.outputs.upload_artifact_refs == '0' && steps.scan.outputs.unquoted_colon == '0' }}
        run: |
          echo "No known automatic fixes applicable"

      - name: Post comment on run (summary)
        uses: actions/github-script@v6
        with:
          script: |
            const run = github.event.workflow_run
            const owner = context.repo.owner
            const repo = context.repo.repo
            const run_id = run.id
            const run_url = run.html_url
            const body = `Automated fixer scanned repository for common workflow issues after failure of ${run.name} (run ${run.id}). If safe fixes were found, a PR was opened. See repo pull requests for details.\n\nRun: ${run_url}`
            await github.rest.issues.createComment({ owner, repo, issue_number: run.id, body }).catch(e=>core.info('could not post comment'))
