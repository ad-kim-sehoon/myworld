name: Report failed workflow runs

on:
  workflow_run:
    workflows: ["Export and Deploy Godot (HTML5)"]
    types: [completed]

jobs:
  report_failure:
    name: Create issue for failed workflow run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Gather failure details and create issue
        uses: actions/github-script@v6
        with:
          script: |
            const run = github.event.workflow_run
            const owner = context.repo.owner
            const repo = context.repo.repo
            const run_id = run.id
            const run_url = run.html_url
            const branch = run.head_branch || run.head_branch === null ? run.head_branch : ''
            const actor = run.actor ? run.actor.login : 'unknown'

            // Fetch jobs for the run to collect failing steps
            const jobsResp = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id })
            const jobs = jobsResp.data.jobs || []

            let body = `The workflow **${run.name}** failed.\n\n` +
              `- Run: ${run_url}\n` +
              `- Conclusion: ${run.conclusion}\n` +
              `- Actor: ${actor}\n` +
              `- Event: ${run.event}\n` +
              (branch ? `- Branch: ${branch}\n` : '') +
              `\n---\n\n`

            for (const job of jobs) {
              body += `### Job: ${job.name} — conclusion: ${job.conclusion}\n`
              if (job.steps && job.steps.length) {
                for (const step of job.steps) {
                  if (step.conclusion && step.conclusion !== 'success') {
                    body += `- Step: **${step.name}** → ${step.conclusion}\n`
                    if (step.number) body += `  - step_number: ${step.number}\n`
                    if (step.started_at) body += `  - started_at: ${step.started_at}\n`
                    if (step.completed_at) body += `  - completed_at: ${step.completed_at}\n`
                  }
                }
              }
              body += `\n`
            }

            body += `\nLogs and full details available in the Actions UI: ${run_url}\n` +
                    `\nPlease triage and attach relevant logs or assign to an owner.\n`

            const title = `CI failure: ${run.name} — run ${run.id}`

            // Create an issue (duplicates will be created if not managed; that's acceptable for now)
            await github.rest.issues.create({ owner, repo, title, body })
            core.info(`Created issue for failed workflow run ${run_id}`)
