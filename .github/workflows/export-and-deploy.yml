name: Export and Deploy Godot (HTML5)

on:
  push:
    branches: [ main ]

jobs:
  export_and_deploy:
    name: Export Godot and deploy to GitHub Pages
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.1.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Debug: print environment"
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Runner: $(uname -a)"
          echo "Java: $(java -version 2>&1 | head -n 1 || true)"
          echo "Node: $(node --version 2>&1 || true)"

      - name: List repo and godot folder (diagnostic)
        run: |
          echo "-- top-level --"
          ls -la || true
          echo "-- godot/ --"
          ls -la godot || true
          echo "-- show export_presets.cfg (if present) --"
          if [ -f godot/export_presets.cfg ]; then
            sed -n '1,200p' godot/export_presets.cfg || true
          else
            echo "(no export_presets.cfg)"
          fi
          echo "-- show project.godot --"
          if [ -f godot/project.godot ]; then
            sed -n '1,200p' godot/project.godot || true
          else
            echo "(no project.godot)"
          fi

      - name: Prepare environment (install prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl
          echo "GODOT_VERSION=$GODOT_VERSION"

      - name: Show export_presets.cfg (if present)
        run: |
          if [ -f godot/export_presets.cfg ]; then
            echo "export_presets.cfg found:";
            sed -n '1,200p' godot/export_presets.cfg || true
          else
            echo "(no export_presets.cfg found)"
          fi

      - name: (Optional) Install Godot export templates (best-effort)
        run: |
          set -e
          TPL_URL="https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "Attempting to download export templates from: $TPL_URL"
          mkdir -p ~/.config/godot
          if curl --head --fail "$TPL_URL" >/dev/null 2>&1; then
            curl -L "$TPL_URL" -o /tmp/export_templates.tpz
            mkdir -p ~/.local/share/godot/templates
            tar -xzf /tmp/export_templates.tpz -C ~/.local/share/godot/templates || true
            echo "Export templates downloaded and extracted (best-effort)"
          else
            echo "Export templates not available at $TPL_URL — continuing and relying on export action to handle templates"
          fi
        continue-on-error: true

      - name: "Export HTML5 (Godot) — download headless, templates, and export"
        id: export_step
        continue-on-error: true
        run: |
          set -euo pipefail
          VER="${{ env.GODOT_VERSION }}"
          CHANNEL="stable"
          echo "Using Godot version: $VER (channel: $CHANNEL)"

          # prepare directories
          mkdir -p ~/.local/share/godot/templates/${VER}.${CHANNEL}

          # download headless binary and export templates (best-effort)
          HEAD_URL="https://github.com/godotengine/godot-builds/releases/download/${VER}-${CHANNEL}/Godot_v${VER}-${CHANNEL}_linux_headless.64.zip"
          TPL_URL="https://github.com/godotengine/godot-builds/releases/download/${VER}-${CHANNEL}/Godot_v${VER}-${CHANNEL}_export_templates.tpz"

          echo "Attempting to download headless binary: $HEAD_URL"
          if curl --head --fail "$HEAD_URL" >/dev/null 2>&1; then
            curl -L "$HEAD_URL" -o /tmp/godot_headless.zip
            unzip -q /tmp/godot_headless.zip -d /tmp || true
            # find binary
            BINPATH=$(ls /tmp | grep Godot | grep headless || true)
            if [ -n "$BINPATH" ]; then
              sudo mv /tmp/$BINPATH /usr/local/bin/godot || true
              sudo chmod +x /usr/local/bin/godot || true
            fi
          else
            echo "Headless binary not found at $HEAD_URL — proceeding and hoping runner has godot"
          fi

          echo "Attempting to download export templates: $TPL_URL"
          if curl --head --fail "$TPL_URL" >/dev/null 2>&1; then
            curl -L "$TPL_URL" -o /tmp/export_templates.tpz
            mkdir -p ~/.local/share/godot/templates/${VER}.${CHANNEL}
            tar -xzf /tmp/export_templates.tpz -C ~/.local/share/godot/templates/${VER}.${CHANNEL} || true
            echo "Export templates installed"
          else
            echo "Export templates not found at $TPL_URL — continuing"
          fi

          # ensure export output dir
          mkdir -p godot/build/html5

          # run export (allow failure to gather diagnostics)
          if command -v /usr/local/bin/godot >/dev/null 2>&1; then
            echo "Running godot export via /usr/local/bin/godot"
            /usr/local/bin/godot --path godot --export HTML5 build/html5/index.html || true
          elif command -v godot >/dev/null 2>&1; then
            echo "Running godot export via godot"
            godot --path godot --export HTML5 build/html5/index.html || true
          else
            echo "No godot binary found on runner; export cannot run"
          fi

      - name: Check export output
        run: |
          if [ -d "godot/build/html5" ] && [ "$(ls -A godot/build/html5 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Export directory present and not empty"
            ls -la godot/build/html5 || true
          else
            echo "Export failed or output missing — collecting diagnostics"
            echo "-- current dir --"
            ls -la || true
            echo "-- godot dir --"
            ls -la godot || true
            echo "-- show export_presets.cfg --"
            sed -n '1,200p' godot/export_presets.cfg || true
            echo "-- show project.godot --"
            sed -n '1,200p' godot/project.godot || true
            echo "--- workspace disk usage ---"
            du -sh . || true
            # Fail the job so we can see the logs in GitHub Actions UI
            exit 1
          fi

      - name: Publish to gh-pages (peaceiris)
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: godot/build/html5
