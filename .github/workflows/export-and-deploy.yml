name: Export and Deploy Godot (HTML5)

on:
  push:
    branches: [ main ]

jobs:
  export_and_deploy:
    name: Export Godot and deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl

      - name: Ensure export_presets.cfg exists
        run: |
          if [ ! -f godot/export_presets.cfg ]; then
            echo "No export_presets.cfg found"
            exit 1
          fi

      - name: Download Godot headless and export templates (best-effort)
        run: |
          set -euo pipefail
          VER="4.1.0"
          CHANNEL="stable"
          HEAD_URL="https://github.com/godotengine/godot-builds/releases/download/${VER}-${CHANNEL}/Godot_v${VER}-${CHANNEL}_linux_headless.64.zip"
          TPL_URL="https://github.com/godotengine/godot-builds/releases/download/${VER}-${CHANNEL}/Godot_v${VER}-${CHANNEL}_export_templates.tpz"

          echo "HEAD_URL=$HEAD_URL"
          if curl --head --fail "$HEAD_URL" >/dev/null 2>&1; then
            curl -L "$HEAD_URL" -o /tmp/godot_headless.zip
            unzip -o /tmp/godot_headless.zip -d /tmp || true
            BINPATH=$(find /tmp -maxdepth 2 -type f -name 'Godot*' -print -quit || true)
            if [ -n "$BINPATH" ]; then
              sudo mv "$BINPATH" /usr/local/bin/godot || true
              sudo chmod +x /usr/local/bin/godot || true
            fi
          else
            echo "Headless binary not available at $HEAD_URL; relying on runner-provided godot if present"
          fi

          if curl --head --fail "$TPL_URL" >/dev/null 2>&1; then
            curl -L "$TPL_URL" -o /tmp/export_templates.tpz
            mkdir -p ~/.local/share/godot/templates/${VER}.${CHANNEL}
            tar -xzf /tmp/export_templates.tpz -C ~/.local/share/godot/templates/${VER}.${CHANNEL} || true
            echo "Templates installed"
          else
            echo "Templates not available at $TPL_URL; proceeding"
          fi

      - name: Run Godot export
        run: |
          set -euo pipefail
          mkdir -p godot/build/html5
          if command -v /usr/local/bin/godot >/dev/null 2>&1; then
            /usr/local/bin/godot --path godot --export HTML5 build/html5/index.html
          elif command -v godot >/dev/null 2>&1; then
            godot --path godot --export HTML5 build/html5/index.html
          else
            echo "No godot binary available; cannot export" >&2
            exit 2
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: godot/build/html5
