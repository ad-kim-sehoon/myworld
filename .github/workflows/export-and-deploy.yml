name: Export and Deploy Godot (HTML5)

on:
  push:
    branches: [ main ]

jobs:
  export_and_deploy:
    name: Export Godot and deploy to GitHub Pages
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '0.0.0-invalid-trigger'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Debug: print environment + trigger heredoc"
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Runner: $(uname -a)"
          echo "Java: $(java -version 2>&1 | head -n 1 || true)"
          echo "Node: $(node --version 2>&1 || true)"
          # This heredoc is intentionally added to trigger the auto-fix scanner
          cat > /tmp/ci_trigger_heredoc.txt <<'EOF'
          AUTOFIX_TRIGGER
          EOF

      - name: List repo and godot folder (diagnostic)
        run: |
          echo "-- top-level --"
          ls -la || true
          echo "-- godot/ --"
          ls -la godot || true
          echo "-- show export_presets.cfg (if present) --"
          if [ -f godot/export_presets.cfg ]; then
            sed -n '1,200p' godot/export_presets.cfg || true
          else
            echo "(no export_presets.cfg)"
          fi
          echo "-- show project.godot --"
          if [ -f godot/project.godot ]; then
            sed -n '1,200p' godot/project.godot || true
          else
            echo "(no project.godot)"
          fi

      - name: Prepare environment (install prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl
          echo "GODOT_VERSION=$GODOT_VERSION"

      - name: Show export_presets.cfg (if present)
        run: |
          if [ -f godot/export_presets.cfg ]; then
            echo "export_presets.cfg found:";
            sed -n '1,200p' godot/export_presets.cfg || true
          else
            echo "(no export_presets.cfg found)"
          fi

      - name: (Optional) Install Godot export templates (best-effort)
        run: |
          set -e
          TPL_URL="https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "Attempting to download export templates from: $TPL_URL"
          mkdir -p ~/.config/godot
          if curl --head --fail "$TPL_URL" >/dev/null 2>&1; then
            curl -L "$TPL_URL" -o /tmp/export_templates.tpz
            mkdir -p ~/.local/share/godot/templates
            tar -xzf /tmp/export_templates.tpz -C ~/.local/share/godot/templates || true
            echo "Export templates downloaded and extracted (best-effort)"
          else
            echo "Export templates not available at $TPL_URL — continuing and relying on export action to handle templates"
          fi
        continue-on-error: true

      - name: "Export HTML5 (Godot) — download headless, templates, and export (debug)"
        id: export_step
        continue-on-error: true
        run: |
          set -xuo pipefail
          VER="${{ env.GODOT_VERSION }}"
          CHANNEL="stable"
          echo "Using Godot version: $VER (channel: $CHANNEL)"

          mkdir -p ~/.local/share/godot/templates/${VER}.${CHANNEL}

          HEAD_URL="https://github.com/godotengine/godot-builds/releases/download/${VER}-${CHANNEL}/Godot_v${VER}-${CHANNEL}_linux_headless.64.zip"
          TPL_URL="https://github.com/godotengine/godot-builds/releases/download/${VER}-${CHANNEL}/Godot_v${VER}-${CHANNEL}_export_templates.tpz"

          echo "HEAD_URL: $HEAD_URL"
          echo "TPL_URL: $TPL_URL"

          echo "-- HEAD_URL HTTP status --"
          curl -I -sS "$HEAD_URL" || true
          echo "-- TPL_URL HTTP status --"
          curl -I -sS "$TPL_URL" || true

          echo "Attempt download headless to /tmp/godot_headless.zip"
          if curl -fL "$HEAD_URL" -o /tmp/godot_headless.zip; then
            echo "Downloaded headless archive"
            ls -la /tmp/godot_headless.zip
            unzip -o /tmp/godot_headless.zip -d /tmp || true
            echo "/tmp listing after unzip:"
            ls -la /tmp | head -n 50
            BINPATH=$(find /tmp -maxdepth 2 -type f -name 'Godot*headless*' -print -quit || true)
            echo "Found binary at: $BINPATH"
            if [ -n "$BINPATH" ]; then
              sudo mv "$BINPATH" /usr/local/bin/godot || true
              sudo chmod +x /usr/local/bin/godot || true
            fi
          else
            echo "Headless binary download failed or not available"
          fi

          echo "Attempt download templates to /tmp/export_templates.tpz"
          if curl -fL "$TPL_URL" -o /tmp/export_templates.tpz; then
            echo "Downloaded templates"
            mkdir -p ~/.local/share/godot/templates/${VER}.${CHANNEL}
            tar -xzf /tmp/export_templates.tpz -C ~/.local/share/godot/templates/${VER}.${CHANNEL} || true
            echo "Templates extracted to ~/.local/share/godot/templates/${VER}.${CHANNEL}"
            ls -la ~/.local/share/godot/templates/${VER}.${CHANNEL} || true
          else
            echo "Templates download failed or not available"
          fi

          echo "-- check godot binary locations --"
          ls -la /usr/local/bin/godot || true
          command -v godot || true
          if command -v godot >/dev/null 2>&1; then
            echo "godot --version:"
            godot --version || true
          fi

          mkdir -p godot/build/html5

          echo "Running export command and capturing output"
          if command -v /usr/local/bin/godot >/dev/null 2>&1; then
            /usr/local/bin/godot --path godot --export HTML5 build/html5/index.html
            EXPORT_STATUS=$?
          elif command -v godot >/dev/null 2>&1; then
            godot --path godot --export HTML5 build/html5/index.html
            EXPORT_STATUS=$?
          else
            echo "No godot binary found on runner; export cannot run"
            EXPORT_STATUS=127
          fi

          echo "Export exit code: $EXPORT_STATUS"
          if [ "$EXPORT_STATUS" -ne 0 ]; then
            echo "Export failed with code $EXPORT_STATUS"
            echo "-- /tmp contents --"
            ls -la /tmp | head -n 80 || true
            echo "-- /usr/local/bin contents --"
            ls -la /usr/local/bin | grep godot || true
            echo "-- godot/build dir --"
            ls -la godot || true
            exit $EXPORT_STATUS
          fi

      - name: Check export output
        run: |
          DIAG_DIR=godot/diagnostics
          mkdir -p "$DIAG_DIR"
          DIAG_FILE="$DIAG_DIR/export_diagnostic.txt"
          echo "=== Export diagnostic ===" > "$DIAG_FILE"
          if [ -d "godot/build/html5" ] && [ "$(ls -A godot/build/html5 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Export directory present and not empty" | tee -a "$DIAG_FILE"
            ls -la godot/build/html5 | tee -a "$DIAG_FILE" || true
          else
            echo "Export failed or output missing — collecting diagnostics" | tee -a "$DIAG_FILE"
            echo "-- current dir --" | tee -a "$DIAG_FILE"
            ls -la | sed -n '1,200p' | tee -a "$DIAG_FILE" || true
            echo "-- godot dir --" | tee -a "$DIAG_FILE"
            ls -la godot | sed -n '1,200p' | tee -a "$DIAG_FILE" || true
            echo "-- show export_presets.cfg --" | tee -a "$DIAG_FILE"
            sed -n '1,200p' godot/export_presets.cfg | tee -a "$DIAG_FILE" || true
            echo "-- show project.godot --" | tee -a "$DIAG_FILE"
            sed -n '1,200p' godot/project.godot | tee -a "$DIAG_FILE" || true
            echo "--- workspace disk usage ---" | tee -a "$DIAG_FILE"
            du -sh . | tee -a "$DIAG_FILE" || true
            # write tail of system logs if available
            echo "--- tail of /tmp/openclaw/openclaw-*.log (if exist) ---" | tee -a "$DIAG_FILE"
            tail -n 200 /tmp/openclaw/openclaw-*.log 2>/dev/null | sed -n '1,200p' | tee -a "$DIAG_FILE" || true
            # Also include last 500 lines of runner syslog if available
            echo "--- end diagnostic ---" >> "$DIAG_FILE"
            # Fail the step so subsequent upload (if: failure()) runs
            exit 1
          fi
      
      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-diagnostics
          path: godot/diagnostics

      - name: Publish to gh-pages (peaceiris)
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: godot/build/html5
