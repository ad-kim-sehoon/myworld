name: Collect diagnostics artifact and create issue

on:
  workflow_run:
    workflows: ["Export and Deploy Godot (HTML5)"]
    types: [completed]

jobs:
  collect_and_report:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Get workflow run artifacts
        id: artifacts
        run: |
          set -euo pipefail
          RUN_ID=${{ github.event.workflow_run.id }}
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}
          echo "Querying artifacts for run $RUN_ID"
          API="https://api.github.com/repos/$OWNER/$REPO/actions/runs/$RUN_ID/artifacts"
          curl -sS -H "Authorization: token ${{ secrets.ACTIONS_MONITOR_PAT }}" -H "Accept: application/vnd.github+json" "$API" > /tmp/artifacts.json
          jq -r '.artifacts[]?.id // empty' /tmp/artifacts.json | head -n1 > /tmp/artifact_id || true
          ART_ID=$(cat /tmp/artifact_id || true)
          if [ -z "$ART_ID" ]; then
            echo "no_artifact=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "artifact_id=$ART_ID" >> $GITHUB_OUTPUT

      - name: Download and extract artifact
        if: steps.artifacts.outputs.artifact_id != ''
        run: |
          set -euo pipefail
          ART_ID=${{ steps.artifacts.outputs.artifact_id }}
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name }}
          ARCHIVE_API="https://api.github.com/repos/$OWNER/$REPO/actions/artifacts/$ART_ID/zip"
          echo "Downloading artifact $ART_ID"
          curl -L -sS -H "Authorization: token ${{ secrets.ACTIONS_MONITOR_PAT }}" -H "Accept: application/vnd.github+json" "$ARCHIVE_API" -o /tmp/artifact.zip
          unzip -o /tmp/artifact.zip -d /tmp/artifact || true
          echo "Extracted to /tmp/artifact"

      - name: Create issue with diagnostics
        if: steps.artifacts.outputs.artifact_id != ''
        run: |
          set -euo pipefail
          RUN_URL=${{ github.event.workflow_run.html_url }}
          DIAG_FILE="/tmp/artifact/godot/diagnostics/export_diagnostic.txt"
          if [ ! -f "$DIAG_FILE" ]; then
            # try other locations
            DIAG_FILE=$(find /tmp/artifact -type f -name '*export_diagnostic*.txt' | head -n1 || true)
          fi
          BODY="Automated diagnostic for failed run: $RUN_URL\n\n"
          if [ -f "$DIAG_FILE" ]; then
            echo "Including diagnostics from $DIAG_FILE"
            CONTENT=$(sed -n '1,6000p' "$DIAG_FILE") || true
            BODY="$BODY\n---BEGIN DIAGNOSTIC---\n$CONTENT\n---END DIAGNOSTIC---\n"
          else
            BODY="$BODY\n(No diagnostic file found in artifact)\n"
          fi
          PAYLOAD=$(jq -n --arg title "CI failure: Export and Deploy Godot (HTML5) — run ${{ github.event.workflow_run.id }}" --arg body "$BODY" '{title:$title,body:$body}')
          curl -sS -X POST -H "Authorization: token ${{ secrets.ACTIONS_MONITOR_PAT }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/issues -d "$PAYLOAD" > /tmp/issue_resp.json
          jq -r '.html_url' /tmp/issue_resp.json || true
