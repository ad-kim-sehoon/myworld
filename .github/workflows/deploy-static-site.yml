name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for peaceiris action environment)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use personal PAT with repo write permissions to ensure push access
          github_token: ${{ secrets.ACTIONS_MONITOR_PAT }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
