name: Auto-merge autofix PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_merge:
    name: Auto-merge PRs created by autofix when checks pass
    runs-on: ubuntu-latest
    if: github.event.pull_request != null

    steps:
      - name: Check PR metadata and labels
        uses: actions/github-script@v6
        id: check_pr
        with:
          script: |
            const pr = context.payload.pull_request
            const owner = context.repo.owner
            const repo = context.repo.repo
            if (!pr) return core.setFailed('No pull_request payload')
            const headRef = pr.head.ref || ''
            const labels = pr.labels.map(l=>l.name)
            core.info(`PR #${pr.number} headRef=${headRef} labels=${labels.join(',')}`)
            // Only handle PRs created by autofix branches and labeled ci-autofix
            if (!headRef.startsWith('autofix/')) {
              core.info('Head ref does not start with autofix/ — skipping')
              return { proceed: false }
            }
            if (!labels.includes('ci-autofix')) {
              core.info('PR not labeled ci-autofix — skipping')
              return { proceed: false }
            }
            return { proceed: true, pr_number: pr.number, sha: pr.head.sha }

      - name: Wait for checks to succeed and merge
        if: steps.check_pr.outputs.proceed == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = parseInt(${(await Promise.resolve('') , 'context.payload.pull_request.number')})
            const pr = context.payload.pull_request
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = pr.head.sha

            core.info(`Waiting for checks on ${sha}`)
            const maxAttempts = 30
            const delayMs = 15000
            let passed = false
            for (let i=0;i<maxAttempts;i++){
              const status = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha })
              core.info(`Attempt ${i+1}: combined state=${status.data.state}`)
              if (status.data.state === 'success') { passed = true; break }
              if (status.data.state === 'failure' || status.data.state === 'error') { break }
              await new Promise(r => setTimeout(r, delayMs))
            }

            if (!passed) {
              core.info('Checks did not pass in time or failed — leaving PR for manual review')
              return
            }

            // Merge the PR (squash)
            core.info(`Merging PR #${pr.number} now that checks passed`)
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' })
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: 'Auto-merged by OpenClaw autofix workflow: CI checks passed.' })
            } catch (e) {
              core.info('Merge failed: ' + e.message)
            }
